<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El armario de Clawd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Silkscreen:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --ink: #1F2240; --ink2: #3A3E6B; --clawd: #DD775B; --sun: #F4C542; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    position: relative; color: var(--ink); font-family: 'Nunito', sans-serif;
    background:
      radial-gradient(circle at 1px 1px, rgba(31, 34, 64, 0.09) 1.2px, transparent 1.6px) 0 0 / 22px 22px,
      linear-gradient(180deg, #F8F2E6 0%, #F5EEDF 45%, #F1E5CF 100%);
  }
  .abs { position: absolute; }
  .px { image-rendering: pixelated; }
  .topbar { left: 56px; right: 56px; top: 56px; display: flex; justify-content: space-between; align-items: center; }
  .pill { font-family: 'Silkscreen'; font-size: 22px; letter-spacing: 1px; background: var(--ink); color: #F5EEDF; padding: 10px 20px 8px; border-radius: 6px; box-shadow: 4px 4px 0 var(--clawd); }
  .no { font-family: 'Silkscreen'; font-weight: 700; font-size: 22px; color: var(--ink2); }
  h1 { left: 0; right: 0; top: 132px; text-align: center; font-family: 'Fredoka'; font-weight: 700; font-size: 104px; line-height: 1; letter-spacing: -1px; }
  h1 span { color: var(--clawd); text-shadow: 6px 6px 0 var(--ink); }
  .lead { left: 90px; right: 90px; top: 262px; text-align: center; font-size: 30px; font-weight: 800; color: var(--ink2); line-height: 1.3; }
  .lead b { color: var(--clawd); }

  .grid { left: 50px; right: 50px; top: 372px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 20px; }
  .card {
    position: relative; height: 296px; background: #fff; border: 3px solid var(--ink); border-radius: 20px;
    box-shadow: 6px 6px 0 var(--ink); padding: 12px 14px 12px; display: flex; flex-direction: column;
  }
  .card .head { display: flex; justify-content: space-between; align-items: center; height: 22px; }
  .card .num { font-family: 'Silkscreen'; font-weight: 700; font-size: 17px; color: var(--ink2); }
  .card .stars { display: flex; gap: 3px; }
  .card .art { margin-top: 8px; height: 168px; border-radius: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .card .art img { max-width: 86%; max-height: 150px; object-fit: contain; position: relative; }
  .card .art::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(255,255,255,.55) 1.4px, transparent 1.8px) 0 0 / 14px 14px; }
  .card h3 { margin-top: 10px; font-family: 'Fredoka'; font-weight: 700; font-size: 31px; line-height: 1; }
  .card p { margin-top: 5px; font-size: 18px; font-weight: 700; color: var(--ink2); line-height: 1.22; }
  .card.legend { border-color: #C9962B; box-shadow: 6px 6px 0 #C9962B; background: linear-gradient(160deg, #FFF8E1, #FFFFFF 40%, #FFF3D1); }
  .card.legend::after {
    content: 'LEGENDARIO'; position: absolute; right: -10px; top: 46px; transform: rotate(8deg);
    font-family: 'Silkscreen'; font-weight: 700; font-size: 15px; background: var(--sun); color: var(--ink); padding: 4px 8px 3px; border: 2px solid var(--ink); border-radius: 4px;
  }

  .stats { left: 50px; right: 50px; top: 1666px; height: 110px; background: var(--ink); border-radius: 20px; display: grid; grid-template-columns: repeat(4, 1fr); padding: 14px 10px; }
  .stat { text-align: center; color: #F5EEDF; border-right: 2px dashed rgba(245, 238, 223, 0.25); padding: 0 8px; }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-family: 'Silkscreen'; font-weight: 700; font-size: 40px; line-height: 1.1; color: var(--sun); }
  .stat span { display: block; font-size: 17px; font-weight: 800; line-height: 1.15; }
  .credits { left: 64px; right: 64px; top: 1796px; }
</style>
</head>
<body>
  <div class="abs topbar"><div class="pill">COLECCIÓN · 12 CARTAS</div><div class="no">#002</div></div>
  <h1 class="abs">El armario de <span>Clawd</span></h1>
  <div class="abs lead">Cada disfraz está dibujado píxel a píxel… <b>¡con código!</b></div>
  <div class="abs grid" id="grid"></div>

  <div class="abs stats">
    <div class="stat"><b>19</b><span>acciones<br>diferentes</span></div>
    <div class="stat"><b>18</b><span>sonidos creados<br>con código</span></div>
    <div class="stat"><b>3.432</b><span>píxeles de<br>disfraces</span></div>
    <div class="stat"><b>2.245</b><span>líneas de<br>código</span></div>
  </div>
  <div class="abs credits" id="credits"></div>

  <script src="pixel.js"></script>
  <script src="credits.js"></script>
  <script>
    const CARDS = [
      ['idle', 'Clawd', 'El original. Parpadea y te mira.', 1, '#FBD9CB'],
      ['music', 'Melómano', 'Cascos puestos y cabeza al ritmo.', 2, '#CFE3F7'],
      ['typing', 'Programador', 'Teclea más rápido que tú.', 2, '#DDE3EA'],
      ['skate', 'Skater', 'Cruza la pantalla y hace un ollie.', 3, '#E9D3DA'],
      ['detective', 'Detective', 'Lupa en mano… ¡una pista!', 3, '#E6DCC9'],
      ['builder', 'Obrero', 'Martillazos con chispas incluidas.', 2, '#FCE7B0'],
      ['chef', 'Chef', 'Voltea tortitas en el aire.', 3, '#F7E1CF'],
      ['cowboy', 'Vaquero', 'Gira el lazo y… ¡yija!', 3, '#E8D7C3'],
      ['wizard', 'Mago', 'Un toque de varita y ¡chispas!', 4, '#DCD6F7'],
      ['astronaut', 'Astronauta', 'Flota sin gravedad.', 4, '#CFD8F0'],
      ['party', 'De fiesta', 'Mecha encendida… ¡bum!', 2, '#FFE2C2'],
      ['cool', 'Muy cool', 'Gafas de sol que caen del cielo.', 5, '#FFE8A3'],
    ];
    const star = pixelSVG(ART.star, 2.6);
    document.getElementById('grid').innerHTML = CARDS.map(([img, name, desc, rarity, tint], i) => `
      <div class="card${rarity === 5 ? ' legend' : ''}">
        <div class="head"><span class="num">#${String(i + 1).padStart(2, '0')}</span><span class="stars">${star.repeat(rarity)}</span></div>
        <div class="art" style="background:${tint}"><img class="px" data-group="cards" src="sprites/${img}.png"></div>
        <h3>${name}</h3>
        <p>${desc}</p>
      </div>`).join('');
    renderCredits(document.getElementById('credits'));
  </script>
</body>
</html>
